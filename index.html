<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop de Massas · Inscrições encerradas</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ color-scheme: light dark; --bg:#f5f3ee; --surface:#fff; --ink:#14213d; --muted:#5f6b85; --accent:#9a6a12; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0e1629; --surface:#16213b; --ink:#f3efe6; --muted:#a9b3c9; --accent:#e0a12f; } }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;
        background:var(--bg); color:var(--ink); font-family:"Poppins",system-ui,sans-serif; text-align:center; }
  .card{ max-width:480px; background:var(--surface); border-radius:20px; padding:40px 28px; box-shadow:0 20px 40px -24px rgba(20,33,61,.35); }
  img{ width:120px; height:auto; margin-bottom:16px; }
  h1{ font-family:"Playfair Display",serif; font-size:30px; margin:0 0 12px; color:var(--accent); }
  p{ font-size:18px; line-height:1.5; margin:0 0 8px; }
  .muted{ color:var(--muted); font-size:15px; }
</style>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="Ministério de Mulheres Vila Camargo">
    <h1>Inscrições encerradas</h1>
    <p>As inscrições para o Workshop de Massas foram encerradas.</p>
    <p class="muted">Obrigada a todas que se inscreveram! 💛<br>Ministério de Mulheres Vila Camargo</p>
  </main>
</body>
</html>
